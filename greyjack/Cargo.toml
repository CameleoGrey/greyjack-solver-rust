
[workspace]
members = [
    "greyjack",
    "greyjack-core",
    "greynet",
]
resolver = "2"

[workspace.dependencies]
uuid = { version = "1.0", features = ["v4", "v5"] }
slotmap = "1.0"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
threadpool = "1.8.1"
crossbeam-channel = "0.5.14"
rand = "0.8.5"
rand_distr = "0.4.3"
chrono = "0.4.39"
polars = { version = "0.46.0", features = ["lazy", "ndarray", "serde", "abs"] }
rayon = "1.10.0"
serde = "1.0.219"
serde_json = "1.0.137"
bitvec = "1.0.1"
twox-hash = "1.6.3"
generational-arena = "0.2"
fxhash = "0.2"


#[profile.release]
#lto = true
#codegen-units = 1
#debug = true
#opt-level = 3
#rustflags = ["-C", "target-cpu=native"]